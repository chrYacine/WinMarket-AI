name: CI
on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: wm56_ci
          POSTGRES_PASSWORD: synthetic-ci-password
          POSTGRES_DB: wm56_ci_test
        ports:
          - 5547:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 12
    env:
      WM_DB_TEST_MODE: '1'
      WM_REQUIRE_POSTGRES: '1'
      WM_DISABLE_PGSERVER_AUTOSTART: '1'
      WM_POSTGRES_TEST_URL: postgresql+pg8000://wm56_ci:synthetic-ci-password@127.0.0.1:5547/wm56_ci_test
      EMBEDDING_CACHE_DIR: ${{ github.workspace }}/.model-cache
      LLM_ENABLED: 'false'
      PAPPERS_ENABLED: 'false'
      SESSION_SECRET: synthetic-ci-session-only
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install exact application lock
        run: python -m pip install -r requirements.lock.txt
      - name: Installed dependency consistency
        run: python scripts/check_lock_consistency.py
      - name: Publication and complete reachable Git history scan
        run: python scripts/check_publication.py --git-history
      - name: Blocking correctness lint
        run: python -m flake8 src scripts tests migrations main.py
      - name: Explicit pinned model preparation
        run: python scripts/prepare_model.py --cache "$EMBEDDING_CACHE_DIR"
      - name: Qualification; full suite when the dependency lock changes
        run: |
          mkdir -p artifacts
          targets=(tests/test_lot56_manual_access.py tests/test_lot56_environment_guard.py tests/test_lot56_migration.py tests/test_llm_fallback.py tests/test_lot46_reproducibility.py tests/test_lot50ter_db_target_guard.py tests/test_codex_db_target_routing.py)
          if [[ -n "$(git diff --name-only HEAD^ HEAD -- requirements.lock.txt requirements-test.txt)" ]]; then
            targets=(tests)
          fi
          python scripts/run_tests.py --scratch-parent "${{ runner.temp }}/wm56-tests" --embedding-cache "$EMBEDDING_CACHE_DIR" "${targets[@]}" -q -rs --junitxml=artifacts/junit.xml
      - name: Explicit migrations and application smoke after suite
        env:
          DATABASE_URL: ${{ env.WM_POSTGRES_TEST_URL }}
        run: |
          python -m alembic upgrade head
          python qa/smoke.py
  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Blocking audit: no ignored identifiers and no continue-on-error.
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - run: python -m pip install pip-audit==2.9.0
      - run: python -m pip_audit -r requirements.lock.txt --no-deps --disable-pip
